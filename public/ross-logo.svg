<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="596" height="500" viewBox="-1 -1 31 26" role="img" aria-labelledby="title desc">
  <title id="title">R.O.S.S. eyes — continuous blue-to-green fill</title>
  <desc id="desc">Two filled R.O.S.S. eyes with slightly reduced spacing and one continuous muted electric-blue to green gradient.</desc>

  <defs>
    <linearGradient id="ross-blue-green-continuous"
                    gradientUnits="userSpaceOnUse"
                    x1="0" y1="24"
                    x2="29" y2="0">
      <stop offset="0" stop-color="#3F73BA"/>
      <stop offset="0.38" stop-color="#5598C4"/>
      <stop offset="0.70" stop-color="#78BFAE"/>
      <stop offset="1" stop-color="#A8CDAA"/>
    </linearGradient>
  </defs>

  <g id="ross-eyes"
     fill="url(#ross-blue-green-continuous)"
     shape-rendering="crispEdges">
    <path id="left-eye"
          d="M 4 0 H 8 V 1 H 9 V 2 H 10 V 3 H 11 V 4 H 12 V 20
             H 11 V 21 H 10 V 22 H 9 V 23 H 8 V 24 H 4 V 23 H 3
             V 22 H 2 V 21 H 1 V 20 H 0 V 4 H 1 V 3 H 2 V 2 H 3
             V 1 H 4 Z"/>
    <path id="right-eye"
          d="M 21 0 H 25 V 1 H 26 V 2 H 27 V 3 H 28 V 4 H 29 V 20
             H 28 V 21 H 27 V 22 H 26 V 23 H 25 V 24 H 21 V 23 H 20
             V 22 H 19 V 21 H 18 V 20 H 17 V 4 H 18 V 3 H 19 V 2 H 20
             V 1 H 21 Z"/>
  </g>
</svg>
